name: 💡 Feature request
description: Suggest an improvement. Check the roadmap first.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check [ROADMAP.md](https://github.com/PabloGonSan8/windows-wireless-battery-monitor/blob/main/ROADMAP.md)
        and existing issues first — a 👍 on an existing issue helps prioritize.
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe your situation rather than the solution first.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this myself
