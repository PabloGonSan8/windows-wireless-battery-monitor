[package]
name = "BatteryMonitor"
version = "1.0.0"
edition = "2021"
license = "MIT"

[dependencies]
windows-registry = "0.6"
windows-collections = "0.3"

[dependencies.windows]
version = "0.62"
features = [
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration_Pnp",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
