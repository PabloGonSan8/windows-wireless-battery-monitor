[package]
name = "wireless-battery-monitor"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "Battery level of your Bluetooth devices, always visible in the Windows taskbar"
repository = "https://github.com/PabloGonSan8/windows-wireless-battery-monitor"
readme = "README.md"
keywords = ["bluetooth", "battery", "windows", "taskbar", "ble"]
categories = ["os::windows-apis", "hardware-support"]
publish = false

[[bin]]
name = "WirelessBatteryMonitor"
path = "src/main.rs"

[dependencies]
windows-registry = "0.6"
windows-collections = "0.100"

[dependencies.windows]
version = "0.62"
features = [
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration_Pnp",
    "Foundation_Collections",
    "Win32_Globalization",
    "Storage_Streams",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
